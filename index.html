<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Interactive Photo Gallery</h1>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <div class="gallery">
        <img src="https://picsum.photos/id/1015/300/200" alt="Mountain View"
             onmouseover="upDate(this)" onmouseout="undo()">

        <img src="https://picsum.photos/id/1025/300/200" alt="Cute Dog"
             onmouseover="upDate(this)" onmouseout="undo()">

        <img src="https://picsum.photos/id/1035/300/200" alt="Beautiful Landscape"
             onmouseover="upDate(this)" onmouseout="undo()">

        <img src="https://picsum.photos/id/1040/300/200" alt="Nature"
             onmouseover="upDate(this)" onmouseout="undo()">

        <img src="https://picsum.photos/id/1050/300/200" alt="Forest"
             onmouseover="upDate(this)" onmouseout="undo()">

        <img src="https://picsum.photos/id/1060/300/200" alt="Sea"
             onmouseover="upDate(this)" onmouseout="undo()">
    </div>

    <script src="script.js"></script>

</body>
</html>
